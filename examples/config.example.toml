# KISS My Agent enablement example.
#
# This file is inert at examples/config.example.toml. Setup adds each missing
# public switch independently and preserves every existing value, marked or
# unmarked. KISS My Agent does not set the master model or effort; choose them
# through the Host, conversation, or another Codex configuration layer.
#
# Standalone roles are discovered from <scope>/agents/*.toml. Do not register
# individual role files here. Current bundled roles omit model and set medium
# effort for explorer, coder, and reviewer. KISS My Agent does not set context
# or concurrency defaults.

[features]
multi_agent = true

[agents]
enabled = true
