# KISS My Agent public enablement example.
#
# This file is inert at examples/config.example.toml. Setup merges these two
# switches into the explicitly selected project or global config while
# preserving unrelated settings. An effective user, administrator, or
# one-launch `false` remains authoritative.
#
# Standalone roles are discovered from <scope>/agents/*.toml. Do not register
# individual role files here. Role model and reasoning effort inherit Host
# settings when omitted and belong in the role TOML only when explicitly
# customized. KISS My Agent does not set context or concurrency defaults.

[features]
multi_agent = true

[agents]
enabled = true
