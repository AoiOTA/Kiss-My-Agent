# Inert example: setup fills each missing field in the selected scope.
# Existing user values are preserved; exact managed legacy Sol/max is updated.
# Existing roles are user-owned; configure selected roles explicitly.
# New role seeds use gpt-6-astra / medium. Start a new trusted task after setup.
# This does not set permissions, concurrency or context-window thresholds.

model = "gpt-6-astra" # KISS My Agent managed
model_reasoning_effort = "high" # KISS My Agent managed

[features]
multi_agent = true # KISS My Agent managed

[features.context_management]
experimental_mode = true # KISS My Agent managed

[agents]
enabled = true # KISS My Agent managed
