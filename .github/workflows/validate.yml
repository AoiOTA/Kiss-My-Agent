name: Validate

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-site.txt

      - name: Install contributor dependencies
        run: python -m pip install -r requirements-site.txt

      - name: Run complete deterministic suite
        run: python scripts/test_all.py

      - name: Validate POSIX wrapper
        if: runner.os != 'Windows'
        run: ./scripts/validate.sh

      - name: Validate Windows PowerShell wrapper
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/validate.ps1

      - name: Validate PowerShell wrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/validate.ps1
